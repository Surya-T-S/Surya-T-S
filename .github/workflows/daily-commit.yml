name: Daily Profile Update

on:
  schedule:
    # Runs at 01:30 UTC (7:00 AM IST) and 13:30 UTC (7:00 PM IST) every day
    - cron: '30 1,13 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update README Timestamp
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          sed -i -E "s/<!-- Updated: .* -->/<!-- Updated: $CURRENT_DATE -->/" README.md

      - name: Commit and Push
        run: |
          git config --global user.name "Surya T S"
          git config --global user.email "suryats202006@gmail.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: profile update [skip ci]" && git push)
